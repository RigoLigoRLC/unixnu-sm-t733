schema_version = 2

# SM-T733 board inputs for the upstream UniXNU build driver.
[board]
name = "gts7fewifi"
soc = "SM7325"
soc_source = "sm7325"
os_profile = "ipados-17.7.11-21H461"
description = "Samsung Galaxy Tab S7 FE Wi-Fi (SM-T733)"
kit = "gts7fewifi"

[components]
include = ["ArmDTPlatform", "ArmCpu", "DarwinBoot", "NativePrelink", "VirtioMmioBlock", "NativeUfs", "NativeUsbDebug", "device"]

[device_tree]
source = "device:dts/board.dts"
include_dirs = ["soc:dts"]

# These identifiers select the Apple restore components consumed by prelinking.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

# The device's primary and backup GPT place USERDATA on UFS LUN 0 at these LBAs.
[userdata]
first_lba = 2320896
last_lba = 31099898
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "gts7fewifi_platform_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm7325.config", "os:configs/ipados.config"]
patch_series = [
  "device:patches/arch/arm64/series",
  "soc:patches/xnu/series",
  "device:patches/os/ipados-17.7.11-21H461/series",
  "device:patches/t733-xnu/series",
  "device:patches/t733-xnu/diagnostics.list",
]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-arm-driver.py NativeUfs",
  "build-libpthread-kernel.py",
]

[kernel.prelink]
early_security_init = ""
extra_args = []
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
slide = "-0x1000000"
roots = ["com.apple.kec.corecrypto", "com.apple.iokit.IOStorageFamily"]

[firmware]
config = "gts7fewifi"
dsc = "Platforms/Samsung/gts7fewifiPkg/gts7fewifi.dsc"
fd = "Build/gts7fewifiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/Samsung",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Samsung",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
]

[firmware.defines]
DEVICE_MODEL = "gts7fewifi"
T733_USERDATA_PAYLOAD = "0"

[payload]
volume = "T733ESP"
size_mib = 64
loader = "firmware"
title = "XNU platform boot"
timeout = -1
dram_size = 0x180000000
panic_screen = false
files = [
  { source = "package/Build/Out/AARCH64-DEBUG/UniXNU.efi", destination = "EFI/UniXNU/UpdatedMenu.efi" },
]
extra_entries = [
  { id = "updated-menu", title = "Updated menu", type = "efi", path = "UpdatedMenu.efi" },
  { id = "exit", title = "Return to firmware", type = "action", action = "exit" },
]
text_fixups = []
kernel_args = ["-v", "serial=3", "debug=0x14e", "cpus=1", "armcpu-diagnostics=1", "kt_fixed_zones=120", "native-ufs-discover=1", "native-ufs-diagnostics=1"]

[payload.adt]
chip_id = "733"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
psci_method = "smc"
owned_memory_size = "auto"
packed_data_ramdisk = false
persistent_data = false
ipad_identity = false

[adt.chosen.bytes]
native-usb-debug-config = "010000000000600a00e0000000886f0a00308e0800208e0800f01000001000000000001500001000e00000008000000003000000000000000000000000000000"

[adt.defaults.u32]
sleep-disabled = 1
"kern.maxvnodes" = 10240

[adt.root.string]
model = "SM-T733"

[adt.product.string]
product-name = "Samsung Galaxy Tab S7 FE Wi-Fi"
model = "SM-T733"

# Runtime FDT memory spans 0x80000000..0x200000000; UEFI excludes its holes.
