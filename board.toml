# SM-T733 system configuration for the upstream UniXNU build driver.
[board]
name = "gts7fewifi"
soc = "SM7325"
soc_source = "sm7325"
os_profile = "ipados-17.7.11-21H461"
description = "Samsung Galaxy Tab S7 FE Wi-Fi (SM-T733)"
kit = "gts7fewifi"

[components]
include = [
  "ArmDTPlatform", "ArmCpu", "DarwinBoot", "NativePrelink",
  "VerifiedRoot", "VirtioMmioBlock", "SoftwareAES", "NativeUfs", "NativeRamBlock",
  "NativeMobileDisplay", "NativeGeniSpi", "NativeFocaltechTouch",
  "NativeQcomTsens", "NativeQcomSpmi", "NativePmicKeys",
  "NativeGeniI2c", "NativeQcomDsi", "NativeUsbDebug", "NativeUsbNetwork", "device",
]

[device_tree]
