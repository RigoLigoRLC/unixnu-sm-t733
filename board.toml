# The 21H461 AttentionAwareness initializer creates a circular wait during
# SpringBoard startup. The kernel replaces it after matching the original bytes.
# PosterBoard's two attribute dictionaries omit file protection because this
# Data volume provides POSIX permissions without Apple data protection.
# The lockdownd FairPlay MIG requests 1200 through 1203 use five-second send
# and receive timeouts. Their original stubs release reply ports on failure
# and return the error through the FairPlay hardware query and cleanup calls.
# The libsystem_platform zero-fill entry uses its existing paired-store loop
# for both bzero and memset with a zero value. This avoids DC ZVA faults while
# clearing software-rendered surfaces and preserves the original tail stores.
# IconServices ISCompositor reports rendering mode 0, selecting its existing
# CoreGraphics layer drawing and scaling without CoreImage filter effects.
# The unavailable OpenGL dispatch otherwise crashes iconservicesagent.
# CoreImage reports its OpenGL backend unavailable, so context creation follows
# its existing failure return when Metal is also unavailable on this board.
# CoreUI shape-effect flattening returns a retained input CGImage, preserving
# image ownership when its CI context is unavailable. Text effects use the
# existing CoreGraphics glyph drawing path instead of CoreImage rendering.
text_fixups = [
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  "dyld_shared_cache_arm64.29,1f55b9c,010400a8,35000014",
  "dyld_shared_cache_arm64.13,6ac2294,000840f9,000080d2",
  "dyld_shared_cache_arm64.07,2e2cf98,20008052,00008052",
  "dyld_shared_cache_arm64.11,34f8c7c,eb2bb96de923016d,e00302aaf6fcd614",
  "dyld_shared_cache_arm64.11,34f8da4,ff0302d1eb2b016d,e00302aaacfcd614",
  "dyld_shared_cache_arm64.11,34f19fc,686d25d008a189b9,00008052c0035fd6",
  "lockdownd,2c4a8,61008052,61228052",
  "lockdownd,2c4b4,05008052,05718252",
  "lockdownd,2c704,61008052,61228052",
  "lockdownd,2c710,05008052,05718252",
  "lockdownd,2c888,61008052,61228052",
  "lockdownd,2c894,05008052,05718252",
  "lockdownd,2ca3c,61008052,61228052",
  "lockdownd,2ca48,05008052,05718252",
]

