  "component:NativeRamBlock",
  "build-software-display.py --tree . --kernelcache .cache/firmware/t733-inputs/kernelcache.decompressed --layout .cache/firmware/t733-inputs/bindings/kernel.json",
  "build-touch-input.py --tree . --kernelcache .cache/firmware/t733-inputs/kernelcache.decompressed --layout .cache/firmware/t733-inputs/bindings/kernel.json",
