  "armcpu-redist-ipi=1",
  "native-ufs-root=1", "native-ufs-diagnostics=0", "native-ufs-metadata=1",
  "sheng-pmgr=2",
  "native-usb-debug=1",
  "sheng-gpu-addon=1",
