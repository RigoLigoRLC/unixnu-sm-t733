schema_version = 1

[device]
name = "gts7fewifi"
soc = "SM7325"
os_profile = "ipados-17.7.11-21H461"
summary = "Samsung SM-T733 format 2 baseline48f records eight CPUs, UFS, CPU display and touch. A642L driver and Turnip tooling compiled and deployed as49h with verbose diagnostics; GPU hardware execution remains pending. The49g IODT interrupt-parent panic is addressed by emitting AAPL,phandle in the shared converter."

