inputs = ["SM-T733 uses the SM7325 profile and the iPad7,1 21H461 restore inputs.", "The device's 14 driver and kit submodules retain their community repositories and adaptation revisions."]
configuration = ["Both boards select schema_version 2, sm7325 and ipados-17.7.11-21H461.", "The component list and archive list are complete arrays; device components.toml supplies community identities and board-specific recipes.", "Public payload.adt.chip_id is hexadecimal 733; private local.toml hardware.unique_chip_id enters the official UNIXNU_UNIQUE_CHIP_ID environment variable."]
procedure = ["Run bash scripts/build.sh TAG for the system configuration or add --platform for the platform configuration.", "The official driver resolves output paths from the selected OS profile and defconfig."]
findings = ["Format 2 arrays replace inherited arrays, so every selected component, configuration fragment, patch series and archive remains explicit.", "The SM7325 profile owns common CPU, interrupt, timer, PSCI and UFS facts; the device owns memory span, identity and board policies.", "system-format2-48f completed configure, resolve, kernel, menu, wallpaper, debug-tools and payload with exit code 0."]
completion = ["The selected components and source revisions resolve and the unified build produces the requested payload."]
limits = ["The format 2 observations cover the recorded eight-core, UFS, display and touch boot activity; other hardware observations retain their earlier build TAGs."]
next_action = ["Record subsequent system operations under the current build TAG."]
evidence = [{ kind = "source", reference = "board.toml", result = "The system board selects all four configuration layers and the complete component and archive lists." }, { kind = "source", reference = "docs/archive/FORMAT2_2026-10-25.md", result = "The delivery record names the seven successful stages, FAT deployment and specific USB boot observations for 48f." }]

